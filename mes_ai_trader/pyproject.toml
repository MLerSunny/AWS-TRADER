[tool.poetry]
name = "mes_ai_trader"
version = "0.1.0"
description = "AI-powered trading system"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "mes_ai_trader"}]

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "^1.28.0"
websockets = "^11.0.3"
aiobotocore = "^2.5.0"
pydantic = "^2.0.0"
feast = "^0.30.0"
lightgbm = "^4.0.0"
shap = "^0.42.0"
matplotlib = "^3.7.1"
pandas = "^2.0.0"
numpy = "^1.23.0"
scikit-learn = "^1.2.2"
pyarrow = "^12.0.0"
torch = "^2.0.0"
lightning = "^2.0.0"
pytorch-forecasting = "^1.0.0"
tensorboard = "^2.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
mypy = "^1.5.1"
flake8 = "^6.1.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true 