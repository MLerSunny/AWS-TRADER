name: Flink Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'pipelines/flink/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'pipelines/flink/**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    name: Build Flink Fat-JAR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'sbt'
          
      - name: Build with SBT
        working-directory: mes_ai_trader/pipelines/flink
        run: |
          sbt clean assembly
          
      - name: Rename JAR to ohlcv.jar
        working-directory: mes_ai_trader/pipelines/flink
        run: |
          mkdir -p artifacts
          find target/scala-2.12 -name "*.jar" -type f -exec cp {} artifacts/ohlcv.jar \;
          
      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v3
        with:
          name: ohlcv
          path: mes_ai_trader/pipelines/flink/artifacts/ohlcv.jar
          retention-days: 14
          
      - name: List JAR contents for verification
        working-directory: mes_ai_trader/pipelines/flink
        run: |
          jar -tf artifacts/ohlcv.jar | grep -E "com/mesaitrader/flink/OHLCV.*\.class" || echo "OHLCV classes not found!" 